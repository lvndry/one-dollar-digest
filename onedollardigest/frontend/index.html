<!DOCTYPE html>
<html>
<head>
    <title>One Dollar Digest</title>
</head>
<body>
    <h1>One Dollar Digest</h1>
    <button id="runDigest">Generate Digest</button>
    <pre id="output"></pre>

    <script>
        document.getElementById('runDigest').addEventListener('click', () => {
            fetch('/api/trigger-digest')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('output').textContent = JSON.stringify(data, null, 2);
                });
        });
    </script>
</body>
</html>
